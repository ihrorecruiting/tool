<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transa Report Test</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#667085;--line:#e4e7ec;--acc:#7c3aed;--acc2:#ede9fe;--ok:#12b76a;--warn:#f79009;--bad:#f04438;
  --r-fulda:#0ea5e9;--r-ruhr:#7c3aed;--r-rheinmain:#0d9488;--r-osnabrueck:#92400e;--r-halle:#c026d3;--r-a6:#ea580c}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 10px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}
.sp{flex:1}
select,button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;color:var(--ink);cursor:pointer}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.tabs button{white-space:nowrap;border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:7px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
main{padding:18px 0 40px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted)}
h2{font-size:16px;margin:0 0 4px}
.sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.two{grid-template-columns:3fr 2fr}
.grid>*{min-width:0}
#map{height:520px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mapLock{font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;box-shadow:0 1px 4px rgba(0,0,0,.15);color:var(--ink)}.mapLock.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--acc2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--acc)}
.finds{margin:0;padding-left:18px}
.finds li{margin:4px 0}
.hbars .row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.hbars .row .bar{height:10px}
.hbars .row b{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.msg{padding:40px 16px;text-align:center;color:var(--muted)}
.err{color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:flex;gap:6px;align-items:center}
.qleg{color:var(--ink);font-weight:600}
.qrows{display:grid;gap:10px;margin-top:4px}
.qrow{display:grid;grid-template-columns:170px 1fr 92px;gap:10px;align-items:center;font-size:13.5px}
.qrow b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.qbar{display:flex;height:12px;border-radius:6px;background:#e4e7ec;overflow:hidden}
.qbar i{display:block;height:100%}
@media (max-width:520px){.qrow{grid-template-columns:110px 1fr 80px}}
.ov{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}
.ov.show{display:flex}
.ov .box{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:100%}
.ov input{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
.ov label{font-size:13px;color:var(--muted)}
.stk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 12px}.stk>div{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px}.stk .l{font-size:12px;color:var(--muted)}.stk .v{font-size:22px;font-weight:700}
@media (max-width:520px){.stk{grid-template-columns:repeat(2,1fr)}}
.kpis5{grid-template-columns:repeat(5,1fr)}.kpis4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.kpis5{grid-template-columns:repeat(3,1fr)}.kpis4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.kpis5{grid-template-columns:repeat(2,1fr)}.kpis5>.card:first-child{grid-column:1/-1}}
.zt{display:grid;grid-template-columns:150px 1fr 40px 44px;gap:8px;align-items:center;font-size:13.5px;margin:5px 0}.zt b{text-align:right;font-variant-numeric:tabular-nums}.zt em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
.ztbar{height:14px;border-radius:7px;background:#f2f4f7;overflow:hidden}.ztbar i{display:block;height:100%;border-radius:7px}
@media (max-width:520px){.zt{grid-template-columns:105px 1fr 34px 40px}}
.kpis7{grid-template-columns:repeat(7,1fr)}@media (max-width:1100px){.kpis7{grid-template-columns:repeat(4,1fr)}}@media (max-width:520px){.kpis7{grid-template-columns:repeat(2,1fr)}}
.kpis7 .kpi .v{font-size:24px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg2 button{border:0;border-radius:0;padding:6px 10px;font-size:13px}.seg2 button.on{background:var(--ink);color:#fff}
.amp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.amp i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chk{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.chk input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.chk label{font-size:12.5px;color:var(--muted)}.res{margin-top:12px;display:grid;gap:8px}.res>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
@media (max-width:620px){.chk{grid-template-columns:1fr}}
.days{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:6px}
.days .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.days .d i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:4px 4px 0 0}
.days .d b{font-size:11.5px;color:var(--ink)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}#map{height:360px}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}.hbars .row{grid-template-columns:110px 1fr 36px}}
@media print{header .tabs,header select,header button,.noprint{display:none!important}header{position:static;border:0}body{background:#fff}
  .card{break-inside:avoid;border-color:#ddd}#map{height:430px}main{padding-top:0}.two{grid-template-columns:3fr 2fr}.kpis{grid-template-columns:repeat(6,1fr)}}
</style>
</head>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KEY = "ihro_cockpit_conn";
const COL = { fulda: "#0ea5e9", ruhr: "#7c3aed", rheinmain: "#0d9488", osnabrueck: "#92400e", halle: "#c026d3", a6: "#ea580c" };
const eur = (v) => v == null || !isFinite(v) ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: v < 100 ? 2 : 0, maximumFractionDigits: v < 100 ? 2 : 0 }) + " €";
const pct = (a, b) => b ? Math.round(a / b * 100) + " %" : "–";
const fmtD = (iso) => new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
function conn() { try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { return {}; } }
function km(a, b, c, d) { const R = 6371, r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
// Meta target area of a region: one centre (ziel) or several pins (ziel.punkte, A6 corridor since 06.11.2026)
const zP = (z) => z ? (Array.isArray(z.punkte) && z.punkte.length ? z.punkte : [z]) : [];
// distance measured like for one centre: below z.radius = inside any pin
const zKm = (z, lat, lon) => Math.min(...zP(z).map((p) => km(p.lat, p.lon, lat, lon) - (p.radius || z.radius || 60))) + (z.radius || 60);

let DATA = null, TAB = "alle", map = null, VQ = null, QL = null, AB = null;
// LeadTable-Status (endgültig seit 06.11.2026, Dennis): nach dem Online-Vorgespräch steht der Abstellort-Fall im Status
const ABST_ST = ["Abstellort frei, Vorschlag da", "Abstellort frei, Hilfe nötig", "Kommt entgegen, Vorschlag da", "Kommt entgegen, Hilfe nötig"];
const ONLINE_ST = /^(online-vorqualifiziert|standort passt|standort prüfen|abstellort frei, .+|kommt entgegen, .+)$/i;
const standName = (s) => /^qualifiziert$/i.test(s) ? "telefonisch qualifiziert" : /^online-vorqualifiziert$/i.test(s) ? "online vorqualifiziert" : String(s || "");
const standFarbe = (s) => /^abstellort frei/i.test(s) ? "#16a34a" : /^kommt entgegen/i.test(s) ? "#ea580c" : /^standort prüfen/i.test(s) ? "#ca8a04" : /bestätigt|vertrag/i.test(s) ? "#15803d" : "#2563eb";
/* Abgelehnt / abgesagt mit Grund (Dennis, 04.11.2026). Grund: K.o. aus dem Telefonat, sonst die Nein-Antworten aus dem
   letzten Online-Vorgespräch in der LeadTable-Beschreibung (Make schreibt dort „Frage: Antwort“-Zeilen hinein). */
const AB_ART = { "nicht qualifiziert": "nicht qualifiziert", "absage durch bewerber": "Absage durch Bewerber", "talentpool bestätigt": "Talentpool (Start später)" };
function abGrund(l) {
  const g = l.gespraech;
  if (g && !g.entwurf && Array.isArray(g.ko) && g.ko.length) return "Telefonat, K.o.: " + g.ko.join(", ");
  const d = String(l.description || ""), i = d.toLowerCase().lastIndexOf("vorgespräch online");
  if (i >= 0) {
    const block = d.slice(i).split(/\n/).map((z) => z.trim()).filter(Boolean);
    const kopf = block[0] || "", rest = block.slice(1);
    const nein = rest.filter((z) => /:\s*(nein\b|passt nicht|.*anderes)/i.test(z) && !/am besten erreichbar/i.test(z));
    const warn = rest.filter((z) => /⚠|bitte prüfen/i.test(z));
    const teile = [...nein, ...warn.map((z) => z.replace(/^⚠\s*/, "⚠ "))];
    if (/:\s*nein/i.test(kopf)) teile.unshift("Vorgespräch: kein Interesse");
    if (teile.length) return "Online-Vorgespräch: " + [...new Set(teile)].join(" · ");
  }
  if (g && !g.entwurf && g.klasse) return `Telefonat: ${g.punkte ?? "?"} Punkte, Klasse ${g.klasse}`;
  return "";
}
/* Talentpool steht in der Liste der Qualifizierten unter „Später“, nicht bei den Abgelehnten */
const abListe = (key) => AB.filter((v) => !/talentpool/i.test(v.status) && (key === "alle" || v.region === key)).sort((a, b) => String(b.seit || "").localeCompare(String(a.seit || "")));
function abRow(l) { const v = vqRow(l); const st = String(l.status || "").trim(); return { ...v, status: st, art: AB_ART[st.toLowerCase()] || st, grund: abGrund(l) }; }
function abCard(key) {
  if (!AB) return `<div class="card" style="margin-top:14px"><h2>Abgelehnt / abgesagt</h2><p class="note">Liste konnte nicht geladen werden.</p></div>`;
  const regName = (k) => DATA.regionen.find((r) => r.key === k)?.name || "ohne Region";
  const L = abListe(key);
  const farbe = (a) => /talentpool/i.test(a) ? "#6b7280" : /absage/i.test(a) ? "#b45309" : "#dc2626";
  const ortT = (v) => v.ort || (PLZ[v.plz] ? PLZ[v.plz][2] : "");
  return `<div class="card" style="margin-top:14px"><div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap">
      <div><h2>Abgelehnt / abgesagt${key === "alle" ? "" : " · " + esc(regName(key))}</h2><p class="sub">Nicht qualifiziert (online oder im Telefonat) und Absage durch den Bewerber – mit Grund. Talentpool steht oben bei „Später“. ${L.length} Bewerber.</p></div>
      <button class="pri noprint" id="abXls" ${L.length ? "" : "disabled"}>Als Excel herunterladen</button></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Ergebnis</th><th>Grund</th><th>PLZ / Ort</th>${key === "alle" ? "<th>Region</th>" : ""}<th class="n">seit</th></tr></thead>
    <tbody>${L.map((v) => `<tr><td>${esc(v.name)}</td><td><span style="color:${farbe(v.art)};font-weight:600">${esc(v.art)}</span></td><td>${esc(v.grund) || '<span class="note" style="margin:0">kein Grund vermerkt</span>'}</td><td>${esc([v.plz, ortT(v)].filter(Boolean).join(" "))}</td>${key === "alle" ? `<td><span class="dot" style="background:${COL[v.region] || "#999"}"></span> ${esc(regName(v.region))}</td>` : ""}<td class="n">${fmtD(v.seit)}</td></tr>`).join("")
      || `<tr><td colspan="6" class="note">Noch niemand abgelehnt oder abgesagt${key === "alle" ? "" : " in dieser Region"}.</td></tr>`}</tbody></table></div>
    <p class="note">Grund: bei K.o. im Telefonat die K.o.-Fragen, sonst die Nein-Antworten aus dem Online-Vorgespräch (aus der LeadTable-Beschreibung), sonst Punkte/Klasse aus dem Telefonat.</p></div>`;
}
async function abExcel(key) {
  await xlsxLaden();
  const regName = (k) => DATA.regionen.find((r) => r.key === k)?.name || "ohne Region";
  const L = abListe(key);
  const rows = L.map((v) => ({ Name: v.name, Ergebnis: v.art, Grund: v.grund, PLZ: v.plz, Ort: v.ort || (PLZ[v.plz] ? PLZ[v.plz][2] : ""), Region: regName(v.region), "seit": v.seit ? new Date(v.seit).toLocaleDateString("de-DE") : "" }));
  const ws = XLSX.utils.json_to_sheet(rows); ws["!cols"] = [24, 22, 70, 8, 22, 18, 12].map((w) => ({ wch: w }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Abgelehnt");
  XLSX.writeFile(wb, `Transa_abgelehnt_${key === "alle" ? "alle" : regName(key).replace(/[^\wäöüÄÖÜß-]+/g, "_")}_${new Date().toLocaleDateString("en-CA")}.xlsx`);

const ST_ORD = ["Vertrag unterschrieben", "Abstellort bestätigt", "Abstellort frei, Vorschlag da", "Abstellort frei, Hilfe nötig", "Kommt entgegen, Vorschlag da",

function zStufe(status) {
  const s = String(status || "").trim().toLowerCase();
  if (/^vertrag unterschrieben$|^eingestellt$/.test(s)) return 5;
  if (/^abstellort bestätigt$/.test(s)) return 4;
  if (/^abstellort frei, |^kommt entgegen, /.test(s)) return 3;
  if (/^qualifiziert$|^online-vorqualifiziert$|^standort (passt|prüfen)$|^abstellort-anfrage verschickt$|^keine reaktion auf abstellort$|^mündliche zusage$|bedenkzeit|angebot|nachfass|nachgefasst|details verschickt/.test(s)) return 2;
  return 0;
}

/* Nächste Anschlussstelle mit Lage (für die Richtung „kommt entgegen“) */
function abNah(lat, lon) {
  let best = 1e9, bp = null;
  for (const p of AB_AS) { if (Math.abs(p[0] - lat) > 0.6 || Math.abs(p[1] - lon) > 0.9) continue; const d = km(lat, lon, p[0], p[1]); if (d < best) { best = d; bp = p; } }
  if (!bp) for (const p of AB_AS) { const d = km(lat, lon, p[0], p[1]); if (d < best) { best = d; bp = p; } }
  return { d: best, p: bp };
}
/* Reiter „Abstellorte“: wo die LKW hinkommen. Pro Fahrer: Fall (frei / kommt entgegen), Vorschlag oder Hilfe,
   ungefährer LKW-Standort (frei = Wohnort, entgegen = auf dem Weg zur nächsten Anschlussstelle, 20 km davor).
   Häufungen dieser Standorte zeigen, wo sich mehrere Fahrer einen Abstellort teilen könnten. */
const PL_KAT = [
  ["fv", "Frei + Vorschlag", "#16a34a", true], ["fh", "Frei, Hilfe nötig", "#16a34a", false],
  ["ev", "Entgegen + Vorschlag", "#ea580c", true], ["eh", "Entgegen, Hilfe nötig", "#ea580c", false],
  ["ok", "Abstellort bestätigt / Vertrag", "#0369a1", true], ["of", "Noch nicht gefragt", "#94a3b8", true], ["pr", "Standort prüfen / außerhalb", "#ca8a04", true]];
const PL = Object.fromEntries(PL_KAT.map(([k, t, c, voll]) => [k, { t, c, voll }]));
function plKat(v, e) {
  const s = String(v.status || "").toLowerCase();
  if (/^vertrag unterschrieben$|^abstellort bestätigt$/.test(s)) return "ok";
  if (s === "abstellort frei, vorschlag da") return "fv";
  if (s === "abstellort frei, hilfe nötig") return "fh";
  if (s === "kommt entgegen, vorschlag da") return "ev";
  if (s === "kommt entgegen, hilfe nötig") return "eh";
  if (/^standort prüfen$/.test(s) || e.art === "aus" || e.art === "nop") return "pr";
  // telefonisch Qualifizierte behalten „Qualifiziert“: ihre Antwort auf die Nachfrage steht in der Beschreibung
  const a = v.abst;
  if (a && a.fall === "frei") return a.vorschlag ? "fv" : "fh";
  if (a && a.fall === "entgegen") return a.vorschlag ? "ev" : "eh";
  if (a && /passt_nicht|aus|unbekannt/.test(a.fall)) return "pr";
  return "of";
}
function plDaten(key) {
  return (QL || []).filter((v) => key === "alle" || v.region === key).map((v) => {
    const p = PLZ[v.plz], lat = p ? p[0] : null, lon = p ? p[1] : null;
    const e = abPruef(lat, lon), kat = plKat(v, e);
    let lkw = lat != null ? [lat, lon] : null, nah = null;
    if (lat != null && e.art === "ab") { nah = abNah(lat, lon); const f = Math.max(0, Math.min(1, (nah.d - AB_FREI) / nah.d)); lkw = [lat + (nah.p[0] - lat) * f, lon + (nah.p[1] - lon) * f]; }
    return { ...v, lat, lon, e, kat, nah, lkw, ortName: v.ort || (p ? p[2] : "") || (v.plz ? "PLZ " + v.plz : "unbekannt"),
      vorschlag: v.abst?.vorschlag || "", hilfe: !!v.abst?.hilfe || /hilfe nötig/i.test(v.status || "") };
  });
}

/* Bewerber mit Koordinaten, Entfernung zum Mittelpunkt der Kampagne, Zeitraum-Filter */
function prep() {
  const z = $("zeit").value, ab = z === "alle" ? 0 : Date.now() - Number(z) * 864e5;
  const reg = Object.fromEntries(DATA.regionen.map((r) => [r.key, r]));
  const leads = DATA.leads.filter((l) => !TEST_IDS.has(l.id) && new Date(l.datum).getTime() >= ab).map((l) => {
    const p = PLZ[l.plz]; const zr = reg[l.region]?.ziel;
    const o = { ...l, lat: p ? p[0] : null, lon: p ? p[1] : null, plzOrt: p ? p[2] : "" };
    const ortOk = l.ort && !/^(ruhr|ruhrgebiet|nordwest|nordost|suedwest|südwest|suedost|südost|rheinmain|rhein-main|mitte|osten|westen|norden|sueden|süden|ost|west|nord|süd|sued)$/i.test(l.ort);
    o.ortName = (ortOk ? l.ort : "") || o.plzOrt || (l.plz ? "PLZ " + l.plz : "unbekannt");
    o.km = p && zr ? zKm(zr, p[0], p[1]) : null;
    return o;
  });
  const kosten = DATA.kosten.filter((k) => new Date(k.tag + "T12:00:00").getTime() >= ab - 864e5 / 2);
  return { reg, leads, kosten };
}

/* Häufungen: Bewerber, die höchstens 15 km auseinander wohnen, zusammenfassen */
function cluster(pts, r = 15) {
  const rest = pts.filter((p) => p.lat != null).slice(), out = [];
  while (rest.length) {
    // Punkt mit den meisten Nachbarn als Kern
    let best = 0, bestN = -1;
    rest.forEach((p, i) => { const n = rest.filter((q) => km(p.lat, p.lon, q.lat, q.lon) <= r).length; if (n > bestN) { bestN = n; best = i; } });
    const k = rest[best], grp = rest.filter((q) => km(k.lat, k.lon, q.lat, q.lon) <= r);
    grp.forEach((g) => rest.splice(rest.indexOf(g), 1));
    const orte = {}; grp.forEach((g) => { orte[g.ortName] = (orte[g.ortName] || 0) + 1; });
    const names = Object.entries(orte).sort((a, b) => b[1] - a[1]).map(([n, c]) => c > 1 ? `${n} (${c})` : n);
    out.push({ n: grp.length, lat: grp.reduce((s, g) => s + g.lat, 0) / grp.length, lon: grp.reduce((s, g) => s + g.lon, 0) / grp.length, orte: names, km: grp.filter((g) => g.km != null).reduce((s, g, _, a) => s + g.km / a.length, 0), pts: grp });
  }
  return out.sort((a, b) => b.n - a.n);
}

/* Stand im Ablauf (Status in LeadTable): Online-Vorgespräch ab 04.11.2026 */
const QF = { neu: "#ffffff", mail: "#facc15", erinn: "#f97316", still: "#111827", online: "#1d4ed8", q: "#16a34a", n: "#dc2626", bearb: "#98a2b3" };
const QNAME = { neu: "neu, noch keine Mail", mail: "Mail bekommen (Qualifizierung)", erinn: "Erinnerung bekommen", still: "keine Reaktion auf Vor-Quali",
  online: "online vorqualifiziert: anrufen", q: "von Dennis qualifiziert", n: "nicht qualifiziert / Absage", bearb: "in Bearbeitung (Anruf, Nachfassen …)" };
const QORDER = ["online", "q", "mail", "erinn", "still", "bearb", "n", "neu"];
const qOf = (l) => {
  const s = String(l.status ?? "").trim().toLowerCase();
  if (!s || s === "unbearbeitet") return "neu";
  if (s === "qualifizierung") return "mail";
  if (s === "erinnerungsmail verschickt") return "erinn";
  if (s === "keine reaktion auf vor-quali") return "still";
  if (/^online[- ]vorqualifiziert$|^abstellort frei, |^kommt entgegen, |^standort passt$/.test(s)) return "online";
  if (/nicht qualifiziert|absage|abgesagt|kein interesse|ungeeignet/.test(s)) return "n";
  if (/^qualifiziert$|^abstellort bestätigt$|termin|angebot|vorgestellt|zusage|eingestellt|vertrag/.test(s)) return "q";
  return "bearb";
};
const qDot = (k) => `<i class="dot" style="background:${QF[k]};${k === "neu" ? "box-shadow:inset 0 0 0 2px #98a2b3" : ""}"></i>`;
const qLegend = () => `<div class="legend qleg">${QORDER.map((k) => `<span>${qDot(k)}${QNAME[k]}</span>`).join("")}</div>`;
function qbar(s) {
  const t = Math.max(1, s.n), w = (v) => (v / t * 100).toFixed(1) + "%";
  return `<div class="qbar" title="${QORDER.map((k) => `${s.cnt[k]} ${QNAME[k]}`).join(" · ")}">${QORDER.filter((k) => k !== "neu").map((k) => `<i style="width:${w(s.cnt[k])};background:${QF[k]}"></i>`).join("")}</div>`;
}
function stats(L, K, r) {
  const n = L.length, kost = K.reduce((s, k) => s + k.kosten, 0);
  const mitKm = L.filter((l) => l.km != null), rad = r?.ziel?.radius || 60;
  const inR = mitKm.filter((l) => l.km <= rad).length;
  const avgKm = mitKm.length ? mitKm.reduce((s, l) => s + l.km, 0) / mitKm.length : null;
  const medKm = mitKm.length ? mitKm.map((l) => l.km).sort((a, b) => a - b)[Math.floor(mitKm.length / 2)] : null;
  const bearb = L.filter((l) => l.kat !== "offen").length, err = L.filter((l) => l.kat === "erreicht").length;
  const ce95 = L.filter((l) => /^ja/i.test(l.ce) && /^ja/i.test(l.code95)).length;
  const erf3 = L.filter((l) => /mehr als 3/i.test(l.erfahrung)).length;
  const cnt = Object.fromEntries(QORDER.map((k) => [k, 0])); L.forEach((l) => cnt[qOf(l)]++);
  const qual = cnt.q + cnt.online, nq = cnt.n;
  return { n, kost, cpl: n ? kost / n : null, inR, mitKm: mitKm.length, avgKm, medKm, bearb, err, ce95, erf3, rad, qual, nq, cnt };
}

function hbars(rows) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return `<div class="hbars">${rows.map(([l, v, c]) => `<div class="row"><span>${esc(l)}</span><div class="bar"><i style="width:${v / max * 100}%;${c ? "background:" + c : ""}"></i></div><b>${v}</b></div>`).join("")}</div>`;
}
function verteil(L, key, order) {
  const m = {}; L.forEach((l) => { const v = l[key] || "keine Angabe"; m[v] = (m[v] || 0) + 1; });
  const keys = Object.keys(m).sort((a, b) => (order ? (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99) : 0) || m[b] - m[a]);
  return keys.map((k) => [schoen(k), m[k]]);
}
const SCHOEN = { klasse1: "ADR Klasse 1 (Tank)", basis: "ADR Basis", keinen: "kein ADR", spaeter: "später", "laeuft bald ab": "läuft bald ab", ja: "ja", nein: "nein" };
const schoen = (k) => SCHOEN[k] ?? String(k).replace(/Maerz/g, "März").replace(/ae/g, "ä").replace(/oe(?=[a-z])/g, "ö").replace(/ue(?=[a-z])/g, "ü");
function entfernung(L, rad) {
  // small target areas (A6 corridor: 20 km per pin) get finer steps
  const b = rad <= 30 ? [[0, 10], [10, rad], [rad, rad + 20], [rad + 20, 9999]] : [[0, 20], [20, 40], [40, rad], [rad, rad + 30], [rad + 30, 9999]];
  return b.map(([a, z]) => [z === 9999 ? `über ${a} km` : `${a}–${z} km`, L.filter((l) => l.km != null && l.km >= a && l.km < z).length, z > rad ? "#f79009" : null]);
}

function baseMap(center, zoom) {
  if (!window.L || !window.L.map) { const m = document.getElementById("map"); if (m) m.innerHTML = '<div class="msg">Karte konnte nicht geladen werden (keine Internetverbindung zu unpkg.com / OpenStreetMap). Die Zahlen unten stimmen trotzdem.</div>'; map = null; return null; }
  // Am Handy startet die Karte gesperrt, sonst lässt sich die Seite über der Karte nicht weiterscrollen
  const mobil = window.matchMedia("(pointer: coarse)").matches;
  map = L.map("map", { scrollWheelZoom: false, dragging: !mobil, tap: !mobil }).setView(center, zoom);
  if (mobil) {
    const B = L.control({ position: "topright" });
    B.onAdd = () => {
      const b = L.DomUtil.create("button", "mapLock"); b.type = "button"; b.textContent = "Karte bewegen";
      L.DomEvent.disableClickPropagation(b);
      b.onclick = () => { if (map.dragging.enabled()) { map.dragging.disable(); b.textContent = "Karte bewegen"; b.classList.remove("on"); } else { map.dragging.enable(); b.textContent = "Fertig"; b.classList.add("on"); } };
      return b;
    };
    B.addTo(map);
  }
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 13, attribution: "© OpenStreetMap" }).addTo(map);
  return map;
}
function addRegion(r, L, opts = {}) {
  if (!map) return;
  const c = COL[r.key];
  if (r.ziel) {
    for (const z of zP(r.ziel)) {
      window.L.circle([z.lat, z.lon], { radius: (z.radius || r.ziel.radius) * 1000, color: c, weight: 2, fillOpacity: .04, dashArray: "6 6" }).addTo(map)
        .bindTooltip(`${r.name}: ${r.ziel.radius} km um ${r.ziel.name}`);
      window.L.circleMarker([z.lat, z.lon], { radius: 4, color: c, fillColor: c, fillOpacity: 1 }).addTo(map);
    }
  }
  const pts = L.filter((l) => l.lat != null);
  if (window.L.heatLayer && pts.length) window.L.heatLayer(pts.map((p) => [p.lat, p.lon, 1]), { radius: opts.heat || 28, blur: 22, maxZoom: 10, minOpacity: .3, gradient: { 0.3: "#f1f5f9", 0.6: "#cbd5e1", 0.85: "#94a3b8", 1: "#475569" } } /* nur Grautöne – die Punktfarben stehen für den Stand im Ablauf */).addTo(map);
  // Füllung = Stand im Ablauf (siehe QF), Rand = Farbe der Region; neue liegen unten
  for (const p of pts.slice().sort((a, b) => QORDER.indexOf(qOf(b)) - QORDER.indexOf(qOf(a)))) {
    const q = qOf(p);
    window.L.circleMarker([p.lat, p.lon], { radius: q === "neu" ? 5 : q === "online" ? 9 : 7, color: c, weight: q === "neu" ? 2 : 2.5, fillColor: QF[q], fillOpacity: 1 }).addTo(map)
      .bindTooltip(`<b>${esc(QNAME[q])}</b><br>${esc(p.ortName)} (${p.plz})${p.km != null ? " · " + Math.round(p.km) + " km" : ""} · ${fmtD(p.datum)}${(() => { const e = abPruef(p.lat, p.lon); return e.art === "nop" ? "" : `<br><span style="color:${AB_FARBE[e.art]}">●</span> ${esc(abHinweis(e) || AB_TXT[e.art])}${e.dA != null ? " · " + Math.round(e.dA) + " km zur Autobahn" : ""}`; })()}`);
  }
}

function renderAlle(reg, leads, kosten) {
  const rows = DATA.regionen.map((r) => ({ r, s: stats(leads.filter((l) => l.region === r.key), kosten.filter((k) => k.region === r.key), r), v: r.versuche }));
  const ges = stats(leads, kosten, null), gIn = rows.reduce((s, x) => s + x.s.inR, 0), gKm = rows.reduce((s, x) => s + x.s.mitKm, 0);
  const best = rows.filter((x) => x.s.n).sort((a, b) => a.s.cpl - b.s.cpl), most = rows.slice().sort((a, b) => b.s.n - a.s.n);
  const allCl = cluster(leads).filter((c) => c.n >= 2);
  const finds = [];
  if (most[0]?.s.n) finds.push(`Die meisten Bewerbungen kommen aus <b>${esc(most[0].r.name)}</b> (${most[0].s.n}), die wenigsten aus <b>${esc(most[most.length - 1].r.name)}</b> (${most[most.length - 1].s.n}).`);
  if (best.length > 1) finds.push(`Am günstigsten je Bewerbung: <b>${esc(best[0].r.name)}</b> (${eur(best[0].s.cpl)}), am teuersten: <b>${esc(best[best.length - 1].r.name)}</b> (${eur(best[best.length - 1].s.cpl)}).`);
  if (gKm) finds.push(`${pct(gIn, gKm)} der Bewerber wohnen innerhalb des Meta-Radius, ${gKm - gIn} außerhalb.`);
  if (allCl.length) finds.push(`Häufungen (mehrere Bewerber im Umkreis von 15 km): ${allCl.slice(0, 5).map((c) => `<b>${esc(c.orte[0].replace(/ \(\d+\)$/, ""))}</b> (${c.n})`).join(", ")}.`);
  $("main").innerHTML = `
  ${regelBox(true)}
  <div class="grid kpis">${kpiRow("alle")}</div>
  ${zielCard()}
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>Woher kommen die Bewerber?</h2><p class="sub">Punkt = Bewerber (Wohnort laut PLZ): Füllung = Stand im Ablauf, Rand = Region. Wärme = Häufung, gestrichelt = Meta-Zielgebiet.</p><div id="map"></div>
      ${qLegend()}<div class="legend">${DATA.regionen.map((r) => `<span><i class="dot" style="background:${COL[r.key]}"></i>${esc(r.name)}</span>`).join("")}</div></div>
    <div class="card"><h2>Auf einen Blick</h2><ul class="finds">${finds.map((f) => `<li>${f}</li>`).join("") || "<li>Noch keine Daten im Zeitraum.</li>"}</ul>
      <p class="note">Bewerber ohne gültige PLZ fehlen auf der Karte (${leads.filter((l) => l.lat == null).length}). Ab 31.10. wird zusätzlich der Ort abgefragt; die Karte nutzt immer die PLZ.</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Regionen im Vergleich</h2><p class="sub">Kosten aus Meta, Bewerbungen aus LeadTable (ohne „T_Transa Allgemein“).</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Region</th><th class="n">Bewerbungen</th><th class="n">Werbekosten</th><th class="n">€ / Bewerbung</th><th class="n">im Radius</th><th class="n">Ø Entfernung</th><th class="n">CE + 95</th><th class="n">&gt; 3 J. Erfahrung</th><th class="n">bearbeitet</th><th class="n" style="color:#16a34a">qualifiziert</th><th class="n" style="color:#dc2626">nicht qual.</th></tr></thead>
    <tbody>${rows.map(({ r, s }) => `<tr><td><span class="dot" style="background:${COL[r.key]}"></span> ${esc(r.name)}<br><span class="note" style="margin:0">${r.ziel ? `${r.ziel.radius} km um ${esc(r.ziel.name)}` : "Zielgebiet unbekannt"}</span></td>
      <td class="n"><b>${s.n}</b></td><td class="n">${eur(s.kost)}</td><td class="n">${eur(s.cpl)}</td><td class="n">${pct(s.inR, s.mitKm)}</td><td class="n">${s.avgKm != null ? Math.round(s.avgKm) + " km" : "–"}</td>
      <td class="n">${pct(s.ce95, s.n)}</td><td class="n">${pct(s.erf3, s.n)}</td><td class="n">${s.bearb}</td><td class="n"><b style="color:#16a34a">${s.qual}</b></td><td class="n"><b style="color:#dc2626">${s.nq}</b></td></tr>`).join("")}</tbody></table></div></div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>Bewerbungen je Tag</h2><p class="sub">alle Regionen</p>${daysChart(leads, kosten)}</div>
    <div class="card"><h2>Stand je Region</h2><p class="sub">Anteil der Bewerbungen im gewählten Zeitraum, Farben wie auf der Karte (weiß = neu, ohne Balken)</p>
      <div class="qrows">${rows.map(({ r, s }) => `<div class="qrow"><span><span class="dot" style="background:${COL[r.key]}"></span> ${esc(r.name)}</span>${qbar(s)}<b><span style="color:#16a34a">${s.qual}</span> / <span style="color:#dc2626">${s.nq}</span> / ${s.n}</b></div>`).join("")}</div>
      <p class="note">Zahlen: qualifiziert (online + von dir) / nicht qualifiziert / Bewerbungen gesamt. Grundlage ist der Status in LeadTable.</p></div>
  </div>
  ${vqCard("alle")}
  ${abCard("alle")}`;
  vqBind("alle"); abBind("alle");
  baseMap([51.2, 9.6], 6);
  DATA.regionen.forEach((r) => addRegion(r, leads.filter((l) => l.region === r.key), { heat: 22 }));
  const b = DATA.regionen.filter((r) => r.ziel).map((r) => [r.ziel.lat, r.ziel.lon]);
  if (map && b.length) map.fitBounds(window.L.latLngBounds(b).pad(0.35));
}

function kpi(l, v, s) { return `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s || ""}</div></div>`; }

function daysChart(L, K) {
  if (!L.length && !K.length) return '<div class="note">Keine Daten.</div>';
  const day = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: "Europe/Berlin" });
  const ds = [...new Set([...L.map((l) => day(l.datum)), ...K.map((k) => k.tag)])].sort();
  const first = new Date(ds[0] + "T12:00:00"), last = new Date(Math.max(new Date(ds[ds.length - 1] + "T12:00:00"), Date.now()));
  const all = []; for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) all.push(d.toLocaleDateString("en-CA"));
  const cnt = Object.fromEntries(all.map((d) => [d, 0])); L.forEach((l) => { const d = day(l.datum); if (d in cnt) cnt[d]++; });
  const cost = Object.fromEntries(all.map((d) => [d, 0])); K.forEach((k) => { if (k.tag in cost) cost[k.tag] += k.kosten; });
  const max = Math.max(1, ...Object.values(cnt));
  return `<div class="days">${all.slice(-21).map((d) => `<div class="d" title="${fmtD(d)}: ${cnt[d]} Bewerbungen, ${eur(cost[d])}"><b>${cnt[d] || ""}</b><i style="height:${cnt[d] / max * 90}px"></i><span>${fmtD(d)}</span></div>`).join("")}</div>
  <p class="note">Werbekosten in diesem Zeitraum: ${eur(Object.values(cost).reduce((a, b) => a + b, 0))}. Meta bucht die Kosten des laufenden Tages erst im Lauf des Tages.</p>`;
}

function renderRegion(r, L, K) {
  const s = stats(L, K, r), cl = cluster(L), c = COL[r.key], rad = s.rad;
  const finds = [];
  if (s.mitKm) finds.push(`${pct(s.inR, s.mitKm)} wohnen im Meta-Radius (${rad} km um ${esc(r.ziel?.name || "?")}), ${s.mitKm - s.inR} außerhalb. Mittlere Entfernung ${Math.round(s.medKm)} km.`);
  const multi = cl.filter((x) => x.n >= 2);
  if (multi.length) finds.push(`Häufungen: ${multi.slice(0, 4).map((x) => `<b>${esc(x.orte.slice(0, 3).join(", "))}</b> – ${x.n} Bewerber, ca. ${Math.round(x.km)} km vom Mittelpunkt`).join("; ")}.`);
  else if (L.length) finds.push("Noch keine Häufung: Die Bewerber verteilen sich einzeln über das Gebiet.");
  const fern = L.filter((l) => l.km != null && l.km > rad + 30).sort((a, b) => b.km - a.km);
  if (fern.length) finds.push(`Weit außerhalb (mehr als ${rad + 30} km): ${fern.slice(0, 5).map((l) => `${esc(l.ortName)} (${Math.round(l.km)} km)`).join(", ")}.`);
  $("main").innerHTML = `
  <div class="grid kpis">${kpiRow(r.key)}</div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>Herkunft der Bewerber · ${esc(r.name)}</h2><p class="sub">${r.ziel ? `Meta-Zielgebiet: ${rad} km um ${esc(r.ziel.name)} (gestrichelt).` : "Zielgebiet aus Meta nicht verfügbar."} Punkt = Bewerber, Füllung = Stand im Ablauf, Wärme = Häufung.</p><div id="map"></div>${qLegend()}</div>
    <div class="card"><h2>Auf einen Blick</h2><ul class="finds">${finds.map((f) => `<li>${f}</li>`).join("") || "<li>Noch keine Bewerbungen im Zeitraum.</li>"}</ul>
      <h2 style="margin-top:18px">Entfernung zum Mittelpunkt bzw. zur nächsten Nadel</h2>${hbars(entfernung(L, rad))}
      <p class="note">Orange = außerhalb des Meta-Radius. ${L.filter((l) => l.lat == null).length ? L.filter((l) => l.lat == null).length + " Bewerber ohne gültige PLZ." : ""}</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Häufungen (Umkreis 15 km)</h2><p class="sub">Bewerber, die nah beieinander wohnen, zusammengefasst. Hilft zu sehen, ob ein Gebiet besonders gut zieht.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Gebiet / Orte</th><th class="n">Bewerber</th><th class="n">km zum Mittelpunkt</th><th>Anteil</th></tr></thead>
    <tbody>${cl.map((x) => `<tr><td>${esc(x.orte.join(", "))}<br><span class="note" style="margin:0">PLZ ${[...new Set(x.pts.map((p) => p.plz))].join(", ")}</span></td><td class="n"><b>${x.n}</b>${x.pts.some((p) => qOf(p) !== "neu") ? `<br><span class="note" style="margin:0"><span style="color:#16a34a">${x.pts.filter((p) => ["q", "online"].includes(qOf(p))).length} q</span> · <span style="color:#dc2626">${x.pts.filter((p) => qOf(p) === "n").length} n</span></span>` : ""}</td><td class="n">${Math.round(x.km)}${x.km > rad ? ' <span style="color:#f79009">●</span>' : ""}</td><td><div class="bar"><i style="width:${x.n / Math.max(1, L.length) * 100}%;background:${c}"></i></div></td></tr>`).join("") || '<tr><td colspan="4" class="note">Keine Bewerber mit PLZ.</td></tr>'}</tbody></table></div></div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><h2>Bewerbungen je Tag</h2><p class="sub">${esc(r.name)}</p>${daysChart(L, K)}</div>
    <div class="card"><h2>Qualität laut Formular</h2>
      <p class="sub">Berufserfahrung</p>${hbars(verteil(L, "erfahrung", ["mehr als 3 Jahre", "1 bis 3 Jahre", "unter 1 Jahr"]).map(([k, v]) => [k, v, c]))}
      <p class="sub" style="margin-top:12px">Möglicher Start</p>${hbars(verteil(L, "start").map(([k, v]) => [k, v, c]))}
      <p class="sub" style="margin-top:12px">ADR-Schein</p>${hbars(verteil(L, "adr").map(([k, v]) => [k, v, c]))}
      <p class="note">CE + Code 95: ${pct(s.ce95, s.n)} · Wohnsitz in Deutschland: ${pct(L.filter((l) => /^ja/i.test(l.wohnsitz_de)).length, s.n)}</p></div>
  </div>
  ${vqCard(r.key)}
  ${abCard(r.key)}`;
  vqBind(r.key); abBind(r.key);
  baseMap(r.ziel ? [r.ziel.lat, r.ziel.lon] : [51.2, 9.6], r.ziel ? 8 : 6);
  addRegion(r, L);
  if (!map) return;

  const pts = L.filter((l) => l.lat != null).map((l) => [l.lat, l.lon]);
  for (const z of zP(r.ziel)) pts.push([z.lat, z.lon]);
  const bounds = window.L.latLngBounds(pts.length ? pts : [[51.2, 9.6]]);
  for (const z of zP(r.ziel)) bounds.extend(window.L.latLng(z.lat, z.lon).toBounds((z.radius || rad) * 2000));
  map.fitBounds(bounds.pad(0.08));
}

$("zeit").onchange = () => DATA && render();
$("reload").onclick = load;
$("print").onclick = () => { if (map) map.invalidateSize(); setTimeout(() => window.print(), 300); };
$("cSave").onclick = () => {
  const u = $("cUrl").value.trim().replace(/\/+$/, ""), t = $("cTok").value.trim();
  if (!u || !t) { $("cErr").textContent = "Bitte beides ausfüllen."; return; }
  localStorage.setItem(KEY, JSON.stringify({ url: u, token: t })); $("conn").classList.remove("show"); $("cErr").textContent = ""; load();
};
load();
</script>
</body>
