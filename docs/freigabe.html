<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Transa · Freigabe</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<script src="lib/leaflet/leaflet.js"></script>
<!-- Freigabe-Seite für Hr. Baumann (09.11.2026). Zugang über eigenen Link #k=<Schlüssel> (Tabelle chef_zugang), darf nur lesen und
     freigeben/stoppen. Daten und Entscheidungen über die Edge Function cockpit-plus (chef_liste, chef_entscheid). Keine Schlüssel in dieser Datei. -->
<style>
  :root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--ink2:#3a3a3c;--ink3:#8a8f98;--sep:rgba(60,60,67,.14);--sep2:rgba(60,60,67,.26);
    --go:#16a34a;--go-t:rgba(22,163,74,.1);--stop:#dc2626;--stop-t:rgba(220,38,38,.08);--warn:#b45309;--warn-t:rgba(234,179,8,.14);--blue:#007AFF;--blue-t:rgba(0,122,255,.1);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--ink2:#d1d1d6;--ink3:#98989f;--sep:rgba(120,120,128,.26);--sep2:rgba(120,120,128,.42)}}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .wrap{max-width:1100px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin:6px 0 14px}
  h1{margin:0;font-size:28px;letter-spacing:-.02em} .sub{color:var(--ink3);font-size:13.5px;margin-top:3px}
  .btn{border:0;border-radius:12px;padding:10px 16px;font:600 15px/1.1 inherit;cursor:pointer;background:var(--sep);color:var(--ink)}
  .btn.go{background:var(--go);color:#fff} .btn.stop{background:var(--stop-t);color:var(--stop)} .btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:default}
  .seg{display:inline-flex;background:var(--sep);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:wrap}
  .seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font:600 14px inherit;color:var(--ink2);cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg b{font-variant-numeric:tabular-nums;margin-left:4px}
  #map{height:300px;border-radius:18px;overflow:hidden;margin-bottom:8px;border:.5px solid var(--sep2);z-index:0}
  .legende{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin:0 0 18px}
  .legende i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .gruppe{margin:22px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap} .gruppe h2{margin:0;font-size:19px} .gruppe .n{color:var(--ink3);font-size:14px}
  .gruppe .btn{margin-left:auto}
  .karte{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;border:.5px solid var(--sep);scroll-margin-top:12px}
  .karte.blink{box-shadow:0 0 0 3px var(--blue)}
  .k1{display:flex;gap:10px 14px;align-items:flex-start;flex-wrap:wrap}
  .k1 .wer{flex:1 1 260px;min-width:0} .wer b{font-size:17px} .wer .ort{color:var(--ink2);font-size:14px;margin-top:2px}
  .lage{display:inline-block;font-size:13px;font-weight:600;border-radius:8px;padding:3px 8px;margin-top:6px}
  .lage.frei{background:var(--go-t);color:var(--go)} .lage.entgegen{background:var(--warn-t);color:var(--warn)} .lage.aus,.lage.unbekannt{background:var(--stop-t);color:var(--stop)}
  .vorschlag{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:var(--blue-t);font-size:14.5px} .vorschlag span{color:var(--ink3);font-size:12.5px;display:block}
  .fakten{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px} .fakten span{font-size:12.5px;background:var(--sep);border-radius:8px;padding:3px 8px;color:var(--ink2)}
  .fakten span.w{background:var(--warn-t);color:var(--warn);font-weight:600}
  .knoepfe{display:flex;gap:8px;flex:0 0 auto;align-items:center}
  .entsch{font-size:13.5px;margin-top:10px;color:var(--ink2)} .entsch.ok{color:var(--go)} .entsch.no{color:var(--stop)}
  .grund{margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep)} .grund .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .grund .chips button{border:.5px solid var(--sep2);background:var(--card);color:var(--ink2);border-radius:999px;padding:6px 11px;font:500 13px inherit;cursor:pointer}
  .grund textarea{width:100%;border:.5px solid var(--sep2);border-radius:12px;padding:10px;font:15px/1.4 inherit;background:var(--bg);color:var(--ink);min-height:60px}
  .grund .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
  .umschalt{margin-top:8px;font-size:14px} .umschalt a{color:var(--blue);text-decoration:none;font-weight:600}
  .stat{font-size:12.5px;color:var(--ink3);margin-top:4px}
  .abschnitt{margin:26px 0 4px;padding:12px 14px;border-radius:14px;background:var(--card);border-left:5px solid var(--go)} .abschnitt.b{border-left-color:var(--warn)}
  .abschnitt h2{margin:0;font-size:20px} .abschnitt p{margin:4px 0 0;color:var(--ink2);font-size:14px}
  .vorschlag.hilfe{background:var(--warn-t)} .idee{margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--go-t);font-size:14px} .idee span{color:var(--ink3);font-size:12.5px;display:block}
  .ideein{display:flex;gap:8px;margin-top:10px} .ideein input{flex:1;border:.5px solid var(--sep2);border-radius:12px;padding:9px 10px;font:15px inherit;background:var(--bg);color:var(--ink);min-width:0}
  .leer{background:var(--card);border-radius:18px;padding:30px;text-align:center;color:var(--ink3)}
  .fehler{background:var(--stop-t);color:var(--stop);border-radius:14px;padding:14px 16px;margin:10px 0}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
  .toast.show{opacity:1}
  @media (max-width:600px){h1{font-size:23px} #map{height:220px} .knoepfe{width:100%} .knoepfe .btn{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="titel">Transa · Freigabe Abstellorte</h1><div class="sub" id="sub">wird geladen …</div><div class="umschalt" id="umschalt"></div></div>
    <button class="btn sm" id="neu" type="button">Aktualisieren</button>
  </header>
  <div class="seg" id="seg">
    <button type="button" data-t="w" class="on">Warten auf Freigabe<b id="nw"></b></button>
    <button type="button" data-t="ok">Freigegeben<b id="nok"></b></button>
    <button type="button" data-t="no">Abgelehnt<b id="nno"></b></button>
  </div>
  <div id="map"></div>
  <div class="legende"><span><i style="background:#16a34a"></i>Abstellort frei (bis 20 km zur Autobahn)</span><span><i style="background:#ea580c"></i>kommt entgegen</span><span><i style="background:#dc2626"></i>außerhalb des Umkreises</span></div>
  <div id="liste"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API = "https://mpsobinfzfjxorfbdzae.supabase.co/functions/v1/cockpit-plus";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
// Zugang: Link mit #k=… einmal öffnen, danach merkt sich das Gerät den Schlüssel
const h = new URLSearchParams(location.hash.slice(1));
if (h.get("k")) { store.set("tc_chef_key", h.get("k")); history.replaceState(null, "", location.pathname); }
const KEY = store.get("tc_chef_key") || "";
// Zwei Listen: ?liste=neu = alle offenen Bewerbungen, vor oder nach Dennis' Telefonat freigeben (Status „Anrufen“); sonst Abstellort-Freigabe
const NEU = new URLSearchParams(location.search).get("liste") === "neu";
let D = null, tab = "w", offenGrund = null, karte = null, schicht = null;
const ST = { w: "Abstellort vorgeschlagen", ok: "Abstellort bestätigt", no: "Freigabe abgelehnt" };
// Reiter je Liste: in der Vorab-Liste zählt die letzte Vorab-Entscheidung (vorab_frei / vorab_stopp), nicht der Status
const reiter = (l) => NEU ? (!l.vorab ? "w" : l.vorab.entscheidung === "vorab_frei" ? "ok" : "no") : Object.keys(ST).find((k) => ST[k] === l.status);
const RANG = { frei: 0, entgegen: 1, unbekannt: 2, aus: 3 };
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); }
async function api(action, data = {}) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "x-chef-key": KEY }, body: JSON.stringify({ action, ...data }) });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok || d.error) throw new Error(d.error || "Verbindung fehlgeschlagen (" + r.status + ")");
  return d;
}
const dt = (x) => x ? new Date(x).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) : "";
function lage(a) {
  if (!a) return `<span class="lage unbekannt">PLZ fehlt</span>`;
  if (a.fall === "frei") return `<span class="lage frei">Abstellort frei · ${a.km} km zur Autobahn</span>`;
  if (a.fall === "entgegen") return `<span class="lage entgegen">kommt ca. ${a.weg} km Richtung Autobahn entgegen</span>`;
  if (a.fall === "aus") return `<span class="lage aus">${a.aus} km über den 60-km-Umkreis (${esc(a.region)})</span>`;
  return `<span class="lage unbekannt">PLZ unbekannt</span>`;
}
function fakten(l) {
  const f = l.fakten || {}, x = [];
  if (f.erfahrung) x.push(`<span>Erfahrung: ${esc(f.erfahrung)}</span>`);
  if (f.start) x.push(`<span>Start: ${esc(f.start)}</span>`);
  if (f.ce) x.push(`<span${f.ce === "nein" ? ' class="w"' : ""}>CE: ${esc(f.ce)}</span>`);
  if (f.code95) x.push(`<span>Code 95: ${esc(f.code95)}</span>`);
  if (f.adr) x.push(`<span>ADR: ${esc(f.adr)}</span>`);
  if (f.auto) x.push(`<span${/nein/i.test(f.auto) ? ' class="w"' : ""}>Eigenes Auto: ${esc(f.auto)}</span>`);
  if (l.gespraech && l.gespraech.klasse) x.push(`<span>Gespräch: ${esc(l.gespraech.klasse)}${l.gespraech.punkte != null ? " · " + l.gespraech.punkte + " P." : ""}</span>`);
  return x.length ? `<div class="fakten">${x.join("")}</div>` : "";
}
// Hilfe-Fall (11.11.2026): kein konkreter Ort – Fahrer findet nichts / möchte Hilfe. Hr. Baumann kann eine Abstellort-Idee eintragen.
const hilfeFall = (l) => !l.vorschlag || /hilfe|braucht|findet nichts|weiß nicht|unklar|keine idee/i.test(l.vorschlag);
const GRUENDE = ["Abstellort passt nicht", "Region aktuell nicht geplant", "Profil passt nicht", "Bitte erst Rücksprache"];
function kartenHtml(l) {
  const e = l.entscheidung, offen = offenGrund === l.lead_id;
  let knoepfe = "";
  if (tab === "w") knoepfe = `<button class="btn stop" data-stopp="${l.lead_id}">Stopp</button><button class="btn go" data-frei="${l.lead_id}">Freigeben</button>`;
  else if (tab === "ok") knoepfe = `<button class="btn sm stop" data-stopp="${l.lead_id}">Doch stoppen</button>`;
  else knoepfe = `<button class="btn sm" data-frei="${l.lead_id}">Doch freigeben</button>`;
  const v = NEU ? l.vorab : e;
  const info = tab === "ok" ? `<div class="entsch ok">✓ freigegeben${v ? ` von ${esc(v.von)} am ${dt(v.created_at)}` : ""}${NEU ? ` · Status jetzt: ${esc(l.status)}` : ""}</div>`
    : tab === "no" ? `<div class="entsch no">✕ ${NEU ? "gestoppt" : "abgelehnt"}${v ? ` von ${esc(v.von)} am ${dt(v.created_at)}: ${esc(v.grund || "")}` : ""}</div>` : "";
  const unter = NEU ? `beworben am ${dt(l.beworben)} · ${esc(l.status)}` : (tab === "w" && l.seit ? `vorgeschlagen am ${dt(l.seit)}` : "");
  return `<div class="karte" id="k-${l.lead_id}">
    <div class="k1"><div class="wer"><b>${esc(l.name || "Ohne Namen")}</b><div class="ort">${esc(l.ort || "")} ${esc(l.plz || "")}</div>${unter ? `<div class="stat">${unter}</div>` : ""}${lage(l.abst)}</div>
      <div class="knoepfe">${knoepfe}</div></div>
    ${NEU ? "" : l.vorschlag ? `<div class="vorschlag${hilfeFall(l) ? " hilfe" : ""}"><span>Abstellort-Vorschlag</span>${esc(l.vorschlag)}</div>` : `<div class="vorschlag hilfe"><span>Abstellort-Vorschlag</span>– noch kein konkreter Ort, der Fahrer braucht Hilfe –</div>`}
    ${!NEU && l.idee ? `<div class="idee"><span>Ihre Abstellort-Idee (${esc(l.idee.von)}, ${dt(l.idee.am)})</span>${esc(l.idee.text)}</div>` : ""}
    ${!NEU && tab === "w" && hilfeFall(l) ? `<div class="ideein"><input id="idee-${l.lead_id}" placeholder="Idee für einen Abstellort, z. B. Firmenhof, Autohof, Gewerbegebiet …"><button class="btn sm" data-idee="${l.lead_id}">Idee an Dennis</button></div>` : ""}
    ${fakten(l)}${info}
    ${offen ? `<div class="grund"><div class="chips">${GRUENDE.map((g) => `<button type="button" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div>
      <textarea id="gt" placeholder="Grund (Dennis sieht ihn im Cockpit und in LeadTable)"></textarea>
      <div class="row"><button class="btn sm" data-abbr="1">Abbrechen</button><button class="btn sm stop" data-stoppok="${l.lead_id}" style="background:var(--stop);color:#fff">Stoppen</button></div></div>` : ""}
  </div>`;
}
function render() {
  if (!D) return;
  const L = D.leads || [], von = (t) => L.filter((l) => reiter(l) === t);
  $("nw").textContent = von("w").length; $("nok").textContent = von("ok").length; $("nno").textContent = von("no").length;
  document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab));
  $("sub").textContent = `Angemeldet als ${D.du || "–"} · Stand ${new Date(D.stand).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} · ${NEU ? "Freigeben = Dennis ruft an und führt das Gespräch" : "Freigeben = Dennis darf den Vertrag schicken"}`;
  const A = von(tab).sort(NEU ? (a, b) => String(a.kampagne).localeCompare(String(b.kampagne), "de") || (RANG[a.abst?.fall] ?? 2) - (RANG[b.abst?.fall] ?? 2) || String(b.beworben).localeCompare(String(a.beworben))
    : (a, b) => String(a.kampagne).localeCompare(String(b.kampagne), "de") || String(a.seit).localeCompare(String(b.seit)));
  if (!A.length) $("liste").innerHTML = `<div class="leer">${tab === "w" ? (NEU ? "Keine offenen Bewerbungen ohne Entscheidung." : "Gerade wartet niemand auf Freigabe. Sobald Dennis einen Abstellort vorschlägt, steht der Bewerber hier.") : "Noch niemand."}</div>`;
  else {
    let html = "", last = null;
    // Abstellort-Freigabe (11.11.2026): A) konkreter Ort vorgeschlagen, B) Fahrer braucht Hilfe bei der Suche
    const teile = !NEU && tab === "w" ? [["a", "A) Konkreter Abstellort vorgeschlagen", "Bitte freigeben oder stoppen.", A.filter((l) => !hilfeFall(l))],
      ["b", "B) Braucht Hilfe bei der Suche", "Der Fahrer passt, findet aber selbst keinen Platz. Wenn Sie eine Idee haben (Firmenhof, Autohof, Gewerbegebiet …), tragen Sie sie ein – Dennis bekommt sie sofort. Freigeben geht trotzdem: Den genauen Platz suchen wir dann gemeinsam vor dem Start.", A.filter(hilfeFall)]] : [[null, "", "", A]];
    for (const [tk, tt, tp, TL] of teile) {
    if (tk) { html += `<div class="abschnitt ${tk}"><h2>${tt} <span class="n" style="font-size:15px;color:var(--ink3)">${TL.length}</span></h2><p>${tp}</p></div>`; last = null; if (!TL.length) { html += `<div class="leer" style="padding:16px">Niemand.</div>`; continue; } }
    for (const l of TL) {
      if (l.kampagne !== last) { last = l.kampagne; const n = TL.filter((x) => x.kampagne === last).length, m = NEU ? TL.filter((x) => x.kampagne === last && x.abst && x.abst.fall !== "aus").length : n;
        html += `<div class="gruppe"><h2>${esc(last || "ohne Kampagne")}</h2><span class="n">${n}</span>${tab === "w" && m > 1 && tk !== "b" ? `<button class="btn sm" data-alle="${esc(last)}">Alle ${m}${NEU && m < n ? " im Umkreis" : ""} freigeben</button>` : ""}</div>`; }
      html += kartenHtml(l);
    }
    }
    $("liste").innerHTML = html;
  }
  karteZeichnen(A);
}
function karteZeichnen(A) {
  if (!window.L) { $("map").innerHTML = '<div class="leer">Karte nicht ladbar.</div>'; return; }
  if (!karte) {
    karte = L.map("map", { scrollWheelZoom: false, dragging: !matchMedia("(pointer: coarse)").matches }).setView([51.1, 9.5], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 13, attribution: "© OpenStreetMap" }).addTo(karte);
  }
  if (schicht) schicht.remove();
  schicht = L.layerGroup().addTo(karte);
  const pts = [];
  for (const l of A) {
    const a = l.abst; if (!a || a.lat == null) continue;
    const c = a.fall === "frei" ? "#16a34a" : a.fall === "entgegen" ? "#ea580c" : "#dc2626";
    L.circleMarker([a.lat, a.lon], { radius: 8, color: "#fff", weight: 2, fillColor: c, fillOpacity: 1 }).addTo(schicht)
      .bindTooltip(`${esc(l.name)} · ${esc(l.ort || l.plz)}`).on("click", () => { const k = $("k-" + l.lead_id); if (k) { k.scrollIntoView({ behavior: "smooth", block: "center" }); k.classList.add("blink"); setTimeout(() => k.classList.remove("blink"), 1600); } });
    pts.push([a.lat, a.lon]);
  }
  if (pts.length) karte.fitBounds(pts, { padding: [30, 30], maxZoom: 10 });
}
async function laden() {
  if (!KEY) { $("sub").textContent = ""; $("liste").innerHTML = `<div class="fehler">Kein Zugang. Bitte den Link verwenden, den Dennis geschickt hat.</div>`; return; }
  try { D = await api(NEU ? "neu_liste" : "chef_liste"); render(); }
  catch (e) { $("liste").innerHTML = `<div class="fehler">${esc(e.message)}</div>`; $("sub").textContent = ""; }
}
async function entscheiden(ids, entscheidung, grund) {
  try {
    const r = await api(NEU ? "neu_entscheid" : "chef_entscheid", { ids, entscheidung, grund });
    if (r.fehler && r.fehler.length) toast("Nicht alles gespeichert: " + r.fehler[0]);
    else toast(entscheidung === "frei" ? (ids.length > 1 ? `${ids.length} freigegeben – Dennis bekommt Bescheid` : "Freigegeben – Dennis bekommt Bescheid") : "Gestoppt – Dennis bekommt Bescheid");
    offenGrund = null; await laden();
  } catch (e) { toast(e.message); }
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.t) { tab = t.dataset.t; offenGrund = null; render(); return; }
  if (t.id === "neu") { laden(); return; }
  if (t.dataset.frei) { t.disabled = true; entscheiden([t.dataset.frei], "frei"); return; }
  if (t.dataset.stopp) { offenGrund = t.dataset.stopp; render(); setTimeout(() => { const g = $("gt"); if (g) g.focus(); }, 0); return; }
  if (t.dataset.g) { const g = $("gt"); g.value = g.value ? g.value + ", " + t.dataset.g : t.dataset.g; g.focus(); return; }
  if (t.dataset.abbr) { offenGrund = null; render(); return; }
  if (t.dataset.idee) { const inp = $("idee-" + t.dataset.idee), text = (inp && inp.value || "").trim(); if (!text) { toast("Bitte kurz die Idee eintragen"); return; }
    t.disabled = true; api("chef_vorschlag", { id: t.dataset.idee, text }).then(() => { toast("Danke – Dennis bekommt die Idee"); laden(); }).catch((e) => { toast(e.message); t.disabled = false; }); return; }
  if (t.dataset.stoppok) { const g = ($("gt").value || "").trim(); if (!g) { toast("Bitte kurz einen Grund angeben"); return; } t.disabled = true; entscheiden([t.dataset.stoppok], "stopp", g); return; }
  if (t.dataset.alle) {
    const ids = (D.leads || []).filter((l) => reiter(l) === "w" && l.kampagne === t.dataset.alle && (!NEU || (l.abst && l.abst.fall !== "aus")) && (NEU || !hilfeFall(l))).map((l) => l.lead_id);
    if (ids.length && confirm(`Alle ${ids.length} Bewerber in „${t.dataset.alle}“ freigeben?${NEU ? " (ohne die außerhalb des Umkreises)" : ""}`)) { t.disabled = true; entscheiden(ids, "frei"); }
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) laden(); });
if (NEU) {
  $("titel").textContent = "Transa · Neue Bewerbungen freigeben";
  const b = document.querySelectorAll("#seg button"); b[0].firstChild.textContent = "Ohne Entscheidung"; b[2].firstChild.textContent = "Gestoppt";
  $("umschalt").innerHTML = `<a href="freigabe.html">→ Zur Freigabe der Abstellorte</a>`;
} else $("umschalt").innerHTML = `<a href="freigabe.html?liste=neu">→ Neue Bewerbungen vorab freigeben</a>`;
